# Nginx configuration for nemo-chat.pydah.edu.in
# Place this file in: /etc/nginx/conf.d/chat.conf

server {
    listen 80;
    listen [::]:80;
    server_name nemo-chat.pydah.edu.in;

    # Root directory where GitHub Actions uploads the frontend build
    root /var/www/pydah-cdn/dist;
    index index.html;

    # Gzip compression for faster loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Allow embedding and CDN usage across all portals
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    # Cache static assets (JS, CSS, images, fonts)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # SPA Routing: Fall back to index.html for direct navigation
    location / {
        try_files $uri $uri/ /index.html;
    }
}

